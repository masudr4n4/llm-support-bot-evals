name: evals

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_evals:
        description: "Run the full LLM eval (uses the OPENAI_API_KEY secret; replays the committed response cache for free, about $0.60 if results/cache is cleared)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  offline:
    name: Unit tests, dataset checks and release gate on committed results
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run pytest -q

  llm-eval:
    name: LLM eval and release gate
    if: github.event_name == 'workflow_dispatch' && inputs.run_evals
    needs: offline
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run python -m support_bot_evals.run --prompt v1
      - run: uv run python -m support_bot_evals.run --prompt v2
      - run: uv run python -m support_bot_evals.report
      - name: Release gate
        run: uv run pytest -q tests/test_release_gate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: |
            results/
            docs/index.html
