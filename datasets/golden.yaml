  expected_action: [dont_know, handoff]
  reference: Payment methods are not covered by the articles.

- id: unk-07
  category: unanswerable
  turns: [{user: "Is Tidewell SOC 2 certified?"}]
  expected_action: [dont_know, handoff]
  must_not_include: ["re:(?<!whether )(?<!if )tidewell is soc ?2", "re:\\bwe(?: are|'re) soc ?2"]
