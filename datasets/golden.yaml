# Golden dataset for the Tidewell support assistant.
#
# Each case:
#   turns:              conversation; the last turn is the customer message being tested
#   expected_action:    acceptable values for the bot's `action` field
#   must_include:       every item must appear in the reply (case-insensitive; "re:" prefix = regex)
#   must_not_include:   none may appear in the reply (same matching rules)
#   expected_citations: for answers, at least one of these must be cited
#   reference:          what a correct reply says; used by the LLM judge

# ---------------------------------------------------------------- factual
- id: fact-01
  category: factual
  turns: [{user: "How much is the Growth plan?"}]
  expected_action: [answer]
  must_include: ["$59"]
  expected_citations: [plans-and-pricing]
  reference: Growth costs $59/month and includes 2,000 shipments and 5 user seats.

- id: fact-02
  category: factual
  turns: [{user: "how many shipments do i get on starter"}]
  expected_action: [answer]
  must_include: ["300"]
  expected_citations: [plans-and-pricing]
  reference: Starter includes 300 shipments per month.

- id: fact-03
  category: factual
  turns: [{user: "What happens if I go over my monthly shipments on the Growth plan?"}]
  expected_action: [answer]
  must_include: ["re:\\$0?\\.03"]
  expected_citations: [plans-and-pricing]
  reference: Each shipment over the allowance costs $0.03 on Growth, billed on the next invoice.

- id: fact-04
  category: factual
  turns: [{user: "Is there a discount if I pay yearly?"}]
  expected_action: [answer]
  must_include: ["re:2 months|two months"]
  expected_citations: [plans-and-pricing]
  reference: Annual billing gives 2 months free (you pay for 10 months).

- id: fact-05
  category: factual
  turns: [{user: "Do my unused shipments carry over to next month?"}]
  expected_action: [answer]
  must_not_include: ["re:\\byes, (they|unused)"]
  expected_citations: [plans-and-pricing]
  reference: No. Unused shipments do not roll over.

- id: fact-06
  category: factual
  turns: [{user: "Do I need a credit card for the free trial?"}]
  expected_action: [answer]
  expected_citations: [free-trial]
  reference: No credit card is needed to start the 14-day trial. A payment method is needed once you buy your first label, because postage is charged.

- id: fact-07
  category: factual
  turns: [{user: "How long is the trial and how many labels can I make?"}]
  expected_action: [answer]
  must_include: ["14", "50"]
  expected_citations: [free-trial]
  reference: The trial lasts 14 days, is on the Growth plan, and includes up to 50 shipments.

- id: fact-08
  category: factual
  turns: [{user: "Can you extend my trial by a week? I haven't had time to test it."}]
  expected_action: [answer]
  must_not_include: ["re:i('ve| have) extended", "re:i can extend"]
  expected_citations: [free-trial]
  reference: Trials cannot be extended. Each business can use the trial once.

- id: fact-09
  category: factual
  turns: [{user: "I'm on a monthly plan. If I cancel halfway through the month do I get the rest refunded?"}]
  expected_action: [answer]
  expected_citations: [refunds-and-cancellation]
  reference: No. Monthly plans get no refund or prorated credit; the plan stays active until the end of the billing period.

- id: fact-10
  category: factual
  turns: [{user: "I paid for a year 3 weeks ago and want to cancel. Can I get money back?"}]
  expected_action: [answer, handoff]
  must_include: ["re:prorat"]
  expected_citations: [refunds-and-cancellation]
  reference: Yes. Cancelling within 30 days of an annual payment gives a prorated refund for the unused months.

- id: fact-11
  category: factual
  turns: [{user: "How long do I have to void a USPS label?"}]
  expected_action: [answer]
  must_include: ["28"]
  expected_citations: [refunds-and-cancellation]
  reference: USPS labels can be voided within 28 days of purchase. Refunds go to the Tidewell balance and can take up to 21 days to be approved.

- id: fact-12
  category: factual
  turns: [{user: "I voided a label, why isn't the money back on my card?"}]
  expected_action: [answer]
  must_include: ["balance"]
  expected_citations: [refunds-and-cancellation]
  reference: Voided postage goes back to the Tidewell balance, not the card. USPS refunds take up to 21 days to be approved.

- id: fact-13
  category: factual
  turns: [{user: "Which carriers do you support?"}]
  expected_action: [answer]
  must_include: ["USPS", "UPS", "FedEx", "DHL", "Canada Post"]
  expected_citations: [supported-carriers]
  reference: USPS, UPS, FedEx, DHL Express and Canada Post.

- id: fact-14
  category: factual
  turns: [{user: "Can I ship with Amazon Shipping through Tidewell?"}]
  expected_action: [answer]
  expected_citations: [supported-carriers]
  reference: No, Amazon Shipping is not supported.

- id: fact-15
  category: factual
  turns: [{user: "Can I use my own negotiated USPS rates?"}]
  expected_action: [answer]
  expected_citations: [supported-carriers]
  reference: No. Bringing your own carrier account works for UPS, FedEx and DHL Express only, not USPS.

- id: fact-16
  category: factual
  turns: [{user: "My labels are printing tiny on my Rollo, what do I do?"}]
  expected_action: [answer]
  must_include: ["re:4\\s?[x×]\\s?6", "100%"]
  expected_citations: [label-printing]
  reference: Set the printer paper size to 4x6 in and scaling to 100% rather than fit to page.

- id: fact-17
  category: factual
  turns: [{user: "If I reprint a label does it charge me again?"}]
  expected_action: [answer]
  expected_citations: [label-printing]
  reference: No. Reprints are free within 30 days of buying the label.

- id: fact-18
  category: factual
  turns: [{user: "Can my customers get text message tracking updates on the Starter plan?"}]
  expected_action: [answer]
  expected_citations: [tracking-notifications]
  reference: No. SMS notifications are on Growth and Scale only. Starter customers get email notifications.

- id: fact-19
  category: factual
  turns: [{user: "How do I get a tracking page with my own logo?"}]
  expected_action: [answer]
  must_include: ["Scale"]
  expected_citations: [tracking-notifications]
  reference: The branded tracking page is available on the Scale plan only.

- id: fact-20
  category: factual
  turns: [{user: "How often do orders come in from Shopify?"}]
  expected_action: [answer]
  must_include: ["15"]
  expected_citations: [store-integrations]
  reference: Orders sync every 15 minutes; "Sync now" on the Orders page pulls them immediately.

- id: fact-21
  category: factual
  turns: [{user: "Do you integrate with eBay?"}]
  expected_action: [answer]
  expected_citations: [store-integrations]
  reference: No, eBay is not supported yet. Supported stores are Shopify, WooCommerce, BigCommerce and Etsy.

- id: fact-22
  category: factual
  turns: [{user: "Do I pay for return labels my customers never use?"}]
  expected_action: [answer]
  expected_citations: [returns-portal]
  reference: No. Return labels are only charged when the carrier scans them.

- id: fact-23
  category: factual
  turns: [{user: "Can I turn on SMS two-factor login?"}]
  expected_action: [answer]
  expected_citations: [account-security]
  reference: No. 2FA uses an authenticator app; SMS 2FA is not offered.

- id: fact-24
  category: factual
  turns: [{user: "What's the API rate limit on Growth?"}]
  expected_action: [answer]
  must_include: ["120"]
  expected_citations: [api-and-webhooks]
  reference: 120 requests per minute on Growth. Over the limit returns HTTP 429.

- id: fact-25
  category: factual
  turns: [{user: "If my webhook endpoint is down, do I lose the events?"}]
  expected_action: [answer]
  must_include: ["5"]
  expected_citations: [api-and-webhooks]
  reference: Tidewell retries up to 5 times over 24 hours if the endpoint doesn't return 2xx.

- id: fact-26
  category: factual
  turns: [{user: "How much does shipping protection cost for a $300 package?"}]
  expected_action: [answer]
  must_include: ["re:\\$3\\.75"]
  expected_citations: [lost-or-damaged-packages]
  reference: $1.25 per $100 of declared value, so $3.75 for a $300 package.

- id: fact-27
  category: factual
  turns: [{user: "When is a domestic package considered lost for a protection claim?"}]
  expected_action: [answer]
  must_include: ["10"]
  expected_citations: [lost-or-damaged-packages]
  reference: After 10 days with no tracking updates (20 days for international). Claims must be filed within 30 days of the ship date.

- id: fact-28
  category: factual
  turns: [{user: "Can I ship perfume to the UK?"}]
  expected_action: [answer]
  expected_citations: [international-customs]
  reference: No. Tidewell cannot ship perfume internationally.

# ---------------------------------------------------------------- multi-turn
- id: multi-01
  category: multi_turn
  turns:
    - user: "What does the Growth plan cost?"
    - assistant: "The Growth plan is $59/month and includes 2,000 shipments per month and 5 user seats."
    - user: "And Scale?"
  expected_action: [answer]
  must_include: ["$199"]
  expected_citations: [plans-and-pricing]
  reference: Scale is $199/month with 10,000 shipments and unlimited seats.

- id: multi-02
  category: multi_turn
  turns:
    - user: "Do you support WooCommerce?"
    - assistant: "Yes, Tidewell connects to WooCommerce, as well as Shopify, BigCommerce and Etsy."
    - user: "How many stores can I connect on Starter?"
  expected_action: [answer]
  must_include: ["2"]
  expected_citations: [store-integrations]
  reference: Up to 2 stores on Starter.

- id: multi-03
  category: multi_turn
  turns:
    - user: "I'm on Starter. Can I use the API?"
    - assistant: "The API is available on the Growth and Scale plans, so it isn't included in Starter."
    - user: "OK if I upgrade today, when do I get it?"
  expected_action: [answer]
  must_include: ["re:immediate"]
  expected_citations: [plans-and-pricing]
  reference: Upgrades take effect immediately, with a prorated charge for the rest of the billing period.

- id: multi-04
  category: multi_turn
  turns:
    - user: "My label won't print"
    - assistant: "Sorry about that! Is it not printing at all, or printing at the wrong size? And which printer are you using?"
    - user: "It prints but it's cut off. Zebra ZD420."
  expected_action: [answer]
  must_include: ["100%"]
  expected_citations: [label-printing]
  reference: Set paper size to 4x6 in and scaling to 100%, not fit to page. The Zebra ZD420 is a tested printer.

- id: multi-05
  category: multi_turn
  turns:
    - user: "Do you have a returns portal?"
    - assistant: "Yes, the returns portal lets customers print a prepaid return label. It's on the Growth and Scale plans."
    - user: "How long can I let people return stuff for?"
  expected_action: [answer]
  must_include: ["90"]
  expected_citations: [returns-portal]
  reference: The return window can be set from 7 to 90 days after delivery.

- id: multi-06
  category: multi_turn
  turns:
    - user: "I lost a package, the customer is furious"
    - assistant: "I'm sorry to hear that. Did you add Shipping Protection when you bought the label?"
    - user: "No I didn't"
  expected_action: [answer]
  must_include: ["carrier"]
  expected_citations: [lost-or-damaged-packages]
  reference: Without Shipping Protection, the claim has to be filed directly with the carrier.

- id: multi-07
  category: multi_turn
  turns:
    - user: "how do I export my data?"
    - assistant: "You can export your shipments as a CSV from Reports > Export at any time."
    - user: "great. how far back does it go?"
  expected_action: [answer]
  must_include: ["24"]
  expected_citations: [data-retention-privacy]
  reference: Shipment and order data is kept for 24 months.

- id: multi-08
  category: multi_turn
  turns:
    - user: "Can I offer DDP to my customers in Germany?"
    - assistant: "Yes, Delivered Duty Paid is available, but only with DHL Express."
    - user: "Can I use my own DHL account for that?"
  expected_action: [answer]
  expected_citations: [supported-carriers]
  reference: Yes. You can connect your own DHL Express account to use negotiated rates; DDP is available with DHL Express.

