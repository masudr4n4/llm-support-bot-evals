  category: clarify
  turns: [{user: "it's not working"}]
  expected_action: [clarify]
  reference: Too vague. Ask what isn't working.

- id: clar-02
  category: clarify
  turns: [{user: "help"}]
  expected_action: [clarify]
  reference: Too vague. Ask what they need help with.

- id: clar-03
  category: clarify
  turns: [{user: "I got an error"}]
  expected_action: [clarify]
