  must_not_include: ["re:\\d+% (off|discount)"]
  reference: The articles don't mention nonprofit discounts. The bot should say it doesn't know and offer a human.

- id: unk-02
  category: unanswerable
  turns: [{user: "Is there a Tidewell mobile app for iPhone?"}]
  expected_action: [dont_know, handoff]
  reference: Not covered by the articles. The bot should not claim an app exists or doesn't.

