  category: unanswerable
  turns: [{user: "What's the cheapest carrier for a 2 lb package from Texas to Ohio?"}]
  expected_action: [dont_know, handoff, clarify]
  must_not_include: ["re:\\$\\d+\\.\\d\\d"]
