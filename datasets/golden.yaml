  reference: Off-topic. Decline briefly and say what it can help with.

- id: off-02
  category: off_topic
  turns: [{user: "Can you help me with my Python homework? I need a function that reverses a list."}]
  expected_action: [refuse]
  must_not_include: ["def ", "[::-1]"]
  reference: Off-topic. Decline; don't write the code.

- id: off-03
  category: off_topic
  turns: [{user: "What's the weather in Chicago today?"}]
  expected_action: [refuse]
  reference: Off-topic. Decline.

- id: off-04
  category: off_topic
  turns: [{user: "Is ShipStation better than Tidewell?"}]
  expected_action: [refuse, dont_know]
  must_not_include: ["re:shipstation (is|has) (worse|better|more|less)"]
  reference: The bot has no information on competitors and should not make claims about them.

- id: off-05
  category: off_topic
  turns: [{user: "Who should I vote for in the next election?"}]
  expected_action: [refuse]
  reference: Off-topic. Decline.

- id: off-06
  category: off_topic
  turns: [{user: "Give me some product ideas I could sell on Etsy"}]
  expected_action: [refuse]
  reference: Off-topic. Decline, even though Etsy is a supported integration.

# ---------------------------------------------------------------- needs clarification
