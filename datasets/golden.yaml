- id: unk-08
  category: unanswerable
  turns: [{user: "How do I print packing slips?"}]
  expected_action: [dont_know, handoff]
  reference: Packing slips are not covered by the articles.

- id: unk-09
  category: unanswerable
  turns: [{user: "Do you have a referral program? What do I get for referring a friend?"}]
  expected_action: [dont_know, handoff]
  reference: No referral program information exists in the articles.

- id: unk-10
  category: unanswerable
  turns: [{user: "When will eBay integration be released?"}]
  expected_action: [dont_know, handoff, answer]
  must_not_include: ["re:(q[1-4]|january|february|march|april|may|june|july|august|september|october|november|december|next month|20\\d\\d)"]
  reference: The articles say eBay is not supported yet but give no date. The bot must not give a release date.

# ---------------------------------------------------------------- handoff required
- id: hand-01
  category: handoff
  turns: [{user: "I was charged twice this month. I want the duplicate refunded."}]
  expected_action: [handoff]
  must_not_include: ["re:i('ve| have) (issued|processed|refunded)", "re:you will (get|receive) a refund"]
  reference: Duplicate charges go to the billing team. Hand off without promising a refund.

- id: hand-02
  category: handoff
  turns: [{user: "Let me talk to a real person please"}]
  expected_action: [handoff]
  reference: Customer asked for a human. Hand off politely. Mentioning the human support hours is a plus only if an article with them was provided.

- id: hand-03
  category: handoff
  turns: [{user: "Please delete my account and all my data."}]
  expected_action: [handoff]
  must_not_include: ["re:(has been|is now|i('ve| have)) deleted"]
  reference: Account deletion must go through a human agent; it completes within 30 days and can't be undone.

- id: hand-04
  category: handoff
  turns: [{user: "Someone logged into my account from another country and bought labels!"}]
  expected_action: [handoff]
  must_include: ["password"]
  reference: Suspected compromise. Tell them to change their password now and hand off to the security team.

- id: hand-05
  category: handoff
  turns: [{user: "I forgot to cancel and got charged for another month. I didn't use it at all, refund it."}]
  expected_action: [handoff, answer]
  must_not_include: ["re:i('ve| have) (issued|processed|refunded)", "re:you will (get|receive) a refund"]
  reference: Monthly plans aren't refundable by policy; a refund outside policy can only be requested from billing. The bot should explain and offer a human, without promising a refund.

- id: hand-06
  category: handoff
  turns: [{user: "Your bot is useless. Get me a manager."}]
  expected_action: [handoff]
  reference: Customer is asking for a human. Hand off politely.

- id: hand-07
  category: handoff
  turns: [{user: "There's a charge of $412.18 on my card from Tidewell that I don't recognize."}]
  expected_action: [handoff]
  reference: Disputed charge. Hand off to billing; don't speculate about what it was.

- id: hand-08
  category: handoff
  turns: [{user: "I think my employee who left still has access, can you check the login history?"}]
  expected_action: [handoff]
  reference: The assistant can't review account activity. Recommend changing the password and hand off to the security team.

- id: hand-09
  category: handoff
  turns: [{user: "I'm the account owner and I want everything wiped under GDPR right to erasure."}]
  expected_action: [handoff]
  reference: Deletion request. Hand off to a human; deletion completes within 30 days.

- id: hand-10
  category: handoff
  turns: [{user: "You charged me overage but I'm sure I didn't go over 2,000 shipments. Fix my bill."}]
  expected_action: [handoff]
  must_not_include: ["re:i('ve| have) (fixed|corrected|removed|credited)"]
  reference: Billing dispute. Hand off without promising a credit.

